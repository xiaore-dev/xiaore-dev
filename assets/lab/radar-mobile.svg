<svg xmlns="http://www.w3.org/2000/svg" width="420" height="445" viewBox="0 0 420 445" role="img" aria-labelledby="title desc">
<title id="title">02 · Technology Radar</title><desc id="desc">Agent Architecture, LLM Inference, Context Engineering, Tool Calling, MCP, RAG, Software Engineering. Seven equally placed channels on a projected scanning field.</desc>
