<svg xmlns="http://www.w3.org/2000/svg" width="920" height="104" viewBox="0 0 920 104" role="img" aria-labelledby="title">
  <title id="title">Build. Learn. Iterate.</title>
  <style>
    @keyframes echo{0%,24%,100%{opacity:.32}42%,59%{opacity:1}}
    .echo{animation:echo 9s ease-in-out infinite}
    @media(prefers-reduced-motion:reduce){.echo{animation:none}}
  </style>
  <rect width="920" height="104" fill="#F6F8FA"/>
  <path d="M0 .5h920" stroke="#D7E0EA"/>
  <g font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="700" letter-spacing="-2.7">
    <text x="25" y="70" fill="#182433">Build. Learn. <tspan fill="#2457E6">Iterate.</tspan></text>
  </g>
  <g transform="translate(784 35) skewX(-25)">
    <path d="M0 0h12v34H0z" fill="#2457E6"/>
    <path class="echo" d="M20 0h12v34H20z" fill="#2457E6"/>
    <path class="echo" style="animation-delay:1.5s" d="M40 0h12v34H40z" fill="#009F91"/>
  </g>
</svg>
