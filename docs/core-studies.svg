<svg xmlns="http://www.w3.org/2000/svg" width="960" height="278" viewBox="0 0 960 278" role="img" aria-labelledby="title desc">
  <title id="title">Three kinetic core studies for Xiaore</title>
  <desc id="desc">Phase Loom interlocks two folded ribbons. Axial Stack floats five crystalline wafers along a spindle. Branch Field draws particles into two branching fans.</desc>
  <style>
    @keyframes tension {0%,100%{transform:skewY(-2deg)}50%{transform:skewY(2deg)}}
    @keyframes lift {0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes settle {0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
    @keyframes gather {0%,100%{transform:scale(1);opacity:.78}50%{transform:scale(.87);opacity:1}}
    @keyframes flow {to{stroke-dashoffset:-72}}
    .loom{animation:tension 10s ease-in-out infinite}.up{animation:lift 8s ease-in-out infinite}.down{animation:settle 8s ease-in-out infinite}
    .fan{animation:gather 9s ease-in-out infinite}.bits{animation:flow 5s linear infinite}
    @media(prefers-reduced-motion:reduce){.loom,.up,.down,.fan,.bits{animation:none}}
  </style>
  <defs>
    <pattern id="ruled" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(22)"><path d="M0 0v6" stroke="#2457E6" stroke-width="1"/></pattern>
    <g id="wafer" stroke="#2457E6" stroke-linejoin="round">
      <path d="M-65-7-9-32 64-6 9 21Z" fill="#F6F8FA"/>
      <path d="m-65-7 74 28v5l-74-28z" fill="#2457E6"/>
      <path d="M9 21 64-6v5L9 26z" fill="#91C4EC"/>
      <path d="m-28-7 22-10 28 10-21 11Z" fill="none"/>
    </g>
    <g id="sprig" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0 22-7 38-19 51-21 69-42 87-45M22-7 42-6 58-12 76-9 94-15M38-19 41-32 52-42 56-57M51-21 70-22 85-33 101-34M42-6 49 5 68 11 76 24" stroke-width="1.7"/>
      <path d="m69-42 2-12m-13 42 8-11m4 1 3-8m-24 35 4 11M85-33l2-12" stroke-width="1"/>
      <path class="bits" d="M0 0 22-7 38-19 51-21 69-42 87-45M0 0 22-7 42-6 49 5 68 11 76 24" stroke="currentColor" stroke-width="4" stroke-dasharray="1 23"/>
      <g stroke="none" fill="currentColor"><circle cx="56" cy="-57" r="2.5"/><circle cx="87" cy="-45" r="2.5"/><circle cx="101" cy="-34" r="2.6"/><circle cx="94" cy="-15" r="2.5"/><circle cx="76" cy="24" r="2.5"/></g>
    </g>
  </defs>
  <rect width="960" height="278" fill="#F6F8FA"/>
  <g stroke="#D7E0EA" fill="none"><path d="M0 198.5h960M320 .5v277M640 .5v277M0 .5h960"/></g>
  <g transform="translate(160 102)">
    <ellipse rx="105" ry="32" transform="rotate(-14)" fill="none" stroke="#A7BACD" stroke-dasharray="70 3 3 3"/>
    <g class="loom" stroke-linejoin="round">
      <path d="M-62-65C-30-65-17-36 2-11S42 30 64 44L44 65C17 48 3 25-13 4S-45-39-77-47Z" fill="#A9DDD8" stroke="#009F91"/>
      <path d="M-77-47C-50-54-23-8-13 4S14 47 44 65L47 59C23 40 7 16-7-3S-45-48-77-47Z" fill="#009F91"/>
      <path d="M-63 61C-28 33-26-5 2-26S35-43 51-68L76-50C55-22 39-22 18-7S-11 35-39 69Z" fill="#2457E6"/>
      <path d="M-63 61C-40 42-34 10-21-8 6-44 27-37 51-68L59-62C35-31 14-30-4-11S-34 49-52 64Z" fill="#F6F8FA" stroke="#2457E6"/>
      <path d="M-63 61C-40 42-34 10-21-8 6-44 27-37 51-68L59-62C35-31 14-30-4-11S-34 49-52 64Z" fill="url(#ruled)"/>
      <path d="m-2-13 11 9-10 12-10-8z" fill="#F6F8FA" stroke="#182433" stroke-width="1.3"/>
    </g>
    <circle cx="98" cy="-31" r="3" fill="#009F91"/>
  </g>
  <g transform="translate(480 103)">
    <path d="M0-84V85" stroke="#64748B" stroke-dasharray="2 4"/>
    <g class="down"><use href="#wafer" transform="translate(0 43)"/></g>
    <use href="#wafer" transform="translate(0 23)"/>
    <use href="#wafer" transform="translate(0 4)"/>
    <g class="up"><use href="#wafer" transform="translate(0 -18)"/><use href="#wafer" transform="translate(0 -42)"/></g>
    <path d="M1-41 19-48-6-58-25-48Z" fill="#009F91"/>
  </g>
  <g transform="translate(800 103)">
    <circle r="58" fill="none" stroke="#D7E0EA" stroke-dasharray="2 5"/>
    <g class="fan">
      <use href="#sprig" transform="rotate(-11)" color="#2457E6"/>
      <use href="#sprig" transform="rotate(164) scale(.97 1.14)" color="#009F91"/>
    </g>
    <path d="m-6 0 6-6 6 6-6 6z" fill="#182433"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#182433" font-size="25" font-weight="700" letter-spacing="-.75">
    <text x="22" y="241">Phase Loom</text><text x="342" y="241">Axial Stack</text><text x="662" y="241">Branch Field</text>
  </g>
  <g font-family="ui-monospace,Consolas,monospace" fill="#2457E6" font-size="15">
    <text x="289" y="240">A</text><text x="609" y="240">B</text><text x="929" y="240">C</text>
  </g>
</svg>
